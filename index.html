<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ti</title>
<style>
  :root { --bg: #14101a; --ink: #f1e6ee; --muted: #9a8a9a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink);
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; overflow: hidden; }
  body { display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); }
  #stage { flex: 1; min-height: 0; position: relative; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #controls { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 10px 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
  #types { display: flex; border: 1.5px solid var(--muted); border-radius: 999px; overflow: hidden; }
  #types button { font: inherit; font-size: 14px; color: var(--muted); background: none; border: 0; padding: 9px 20px; cursor: pointer; }
  #types button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
  #types button:focus-visible { outline: 3px solid #fff; outline-offset: -3px; }
  #row1 { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px; }
  #zoom { display: flex; gap: 8px; }
  #zoom button { font: inherit; font-size: 22px; line-height: 1; width: 40px; height: 40px; border-radius: 50%; color: var(--ink);
    background: none; border: 1.5px solid var(--muted); cursor: pointer; }
  #zoom button:active { background: var(--ink); color: var(--bg); }
  #zoom button:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
  #colors { display: flex; gap: 22px; }
  label { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
  input[type=color] { -webkit-appearance: none; appearance: none; width: 48px; height: 48px; padding: 0;
    border: 2px solid var(--ink); border-radius: 50%; background: none; cursor: pointer; overflow: hidden; }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: none; border-radius: 50%; }
  input[type=color]::-moz-color-swatch { border: none; border-radius: 50%; }
  input[type=color]:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
  <div id="stage"><canvas id="c" aria-label="Ramo giratorio hecho con caracteres de texto. Arrastra para girarlo."></canvas></div>
  <div id="controls">
    <div id="row1">
    <div id="types" role="group" aria-label="Tipo de flor">
      <button id="bTulip" aria-pressed="true">tulipanes</button>
      <button id="bDandelion" aria-pressed="false">dientes de león</button>
    </div>
    <div id="zoom" role="group" aria-label="Zoom">
      <button id="zOut" aria-label="Alejar 20%">&minus;</button>
      <button id="zIn" aria-label="Acercar 20%">+</button>
    </div>
    </div>
    <div id="colors">
      <label>flores <input type="color" id="cFlower" value="#ff5d8f"></label>
      <label>tallos <input type="color" id="cStem" value="#4fae5a"></label>
      <label>hojas <input type="color" id="cLeaf" value="#7fd36b"></label>
      <label>fondo <input type="color" id="cBg" value="#14101a"></label>
    </div>
  </div>

<script>
(function () {
  // ---------- Build the bouquet as 3D points ----------
  // material: 0 petal, 1 stem, 2 leaf, 3 flower centre
  var pts = [];
  function add(x, y, z, m, ch) { pts.push({ x: x, y: y, z: z, m: m, ch: ch }); }
  function norm(v) { var l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0]/l, v[1]/l, v[2]/l]; }
  function cross(a, b) { return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }

  var base = [0, -1.45, 0];
  var heads = [
    [0, 1.15, 0, .50], [-.85, .80, .30, .42], [.85, .85, .20, .42], [-.40, .70, -.75, .40],
    [.55, .70, -.65, .40], [-.15, .55, .85, .40], [-1.10, .30, -.30, .36], [1.05, .30, -.20, .36],
    [.35, .25, .95, .34], [-.65, .20, .75, .34]
  ];

  function tulipHead(C, n, u, v, size) {
    var H = size * 1.7, rings = Math.round(H / .03);
    for (var i = 0; i <= rings; i++) {
      var t = i / rings, rad = size * .85 * (.3 + .7 * Math.sin(Math.PI * Math.min(1, t * .88 + .1)));
      var steps = Math.ceil(2 * Math.PI * rad / .02) + 6;
      for (var j = 0; j < steps; j++) {
        var a = j / steps * 2 * Math.PI, c3 = Math.cos(3 * a);
        var rr = rad * (1 + .12 * c3 * t * t);
        var hh = t * H + size * .35 * t * t * (c3 + 1) * .5;
        var ch = c3 < -.85 ? ":" : (t < .25 ? "%" : t < .55 ? "&" : t < .8 ? "#" : "@");
        add(C[0] + u[0]*rr*Math.cos(a) + v[0]*rr*Math.sin(a) + n[0]*hh,
            C[1] + u[1]*rr*Math.cos(a) + v[1]*rr*Math.sin(a) + n[1]*hh,
            C[2] + u[2]*rr*Math.cos(a) + v[2]*rr*Math.sin(a) + n[2]*hh,
            t < .1 ? 3 : 0, ch);
      }
    }
  }

  function dandelionHead(C, n, u, v, size) {
    var R = size * .8, M = 200, ctr = [C[0] + n[0]*R*.5, C[1] + n[1]*R*.5, C[2] + n[2]*R*.5];
    for (var k = 0; k < M; k++) {
      var y = 1 - 2 * (k + .5) / M, r = Math.sqrt(1 - y * y), th = k * 2.39996;
      var dx = r * Math.cos(th), dz = r * Math.sin(th);
      var d = [u[0]*dx + n[0]*y + v[0]*dz, u[1]*dx + n[1]*y + v[1]*dz, u[2]*dx + n[2]*y + v[2]*dz];
      for (var s = .2; s <= 1.001; s += .1) {
        add(ctr[0] + d[0]*R*s, ctr[1] + d[1]*R*s, ctr[2] + d[2]*R*s, s < .35 ? 3 : 0, s < .35 ? "@" : s < .8 ? ":" : "*");
      }
    }
  }

  function build(type) {
    pts.length = 0;
    var tulip = type === "tulip";
    heads.forEach(function (h, idx) {
      var C = [h[0], h[1], h[2]], size = h[3];
      var ctrl = [C[0] * .25, base[1] + (C[1] - base[1]) * .45, C[2] * .25];
      function bez(t) {
        var a = (1-t)*(1-t), b = 2*(1-t)*t, c = t*t;
        return [a*base[0]+b*ctrl[0]+c*C[0], a*base[1]+b*ctrl[1]+c*C[1], a*base[2]+b*ctrl[2]+c*C[2]];
      }
      for (var i = 0; i <= 70; i++) { var p = bez(i / 70); add(p[0], p[1], p[2], 1, "|"); }
      // leaves
      [.18, .38].forEach(function (t, k) {
        var s0 = bez(t), ang = idx * 2.1 + k * 3.14;
        var dir = [Math.cos(ang), 0, Math.sin(ang)], side = norm(cross(dir, [0, 1, 0]));
        var L = tulip ? .6 : .45, lift = tulip ? .4 : .18;
        for (var s = 0; s <= 1; s += .025) {
          var w = (tulip ? Math.sin(Math.PI * Math.pow(s, .7)) * .09 : Math.sin(Math.PI * s) * .13 * (1 + .35 * Math.sin(s * 28)));
          for (var q = -w; q <= w; q += .022) {
            add(s0[0] + dir[0]*s*L + side[0]*q, s0[1] + s*lift - s*s*(tulip ? .12 : 0) - Math.abs(q)*.3, s0[2] + dir[2]*s*L + side[2]*q, 2,
                Math.abs(q) > w * .7 ? ";" : ":");
          }
        }
      });
      var n = norm([C[0] - ctrl[0], C[1] - ctrl[1], C[2] - ctrl[2]]);
      var u = norm(cross(n, Math.abs(n[1]) > .9 ? [1, 0, 0] : [0, 1, 0])), v = cross(n, u);
      if (tulip) tulipHead(C, n, u, v, size * .8); else dandelionHead(C, n, u, v, size);
    });
  }

  // ---------- Colors ----------
  var inputs = { 0: document.getElementById("cFlower"), 1: document.getElementById("cStem"), 2: document.getElementById("cLeaf") };
  var LEVELS = 6, palette = [[], [], [], []];
  function hex(h) { return [parseInt(h.substr(1,2),16), parseInt(h.substr(3,2),16), parseInt(h.substr(5,2),16)]; }
  function shadeCol(rgb, k) { return "rgb(" + rgb.map(function (c) { return Math.round(c * k); }).join(",") + ")"; }
  function buildPalette() {
    var gold = [255, 214, 90], fl = hex(inputs[0].value);
    var cols = [fl, hex(inputs[1].value), hex(inputs[2].value), fl.map(function (c, i) { return (c + gold[i]) / 2; })];
    for (var m = 0; m < 4; m++) for (var l = 0; l < LEVELS; l++) palette[m][l] = shadeCol(cols[m], .42 + .58 * l / (LEVELS - 1));
  }
  Object.keys(inputs).forEach(function (k) { inputs[k].addEventListener("input", buildPalette); });
  buildPalette();

  // ---------- Background color (text and buttons switch to stay readable) ----------
  var root = document.documentElement;
  document.getElementById("cBg").addEventListener("input", function (e) {
    var c = hex(e.target.value), lum = (.299 * c[0] + .587 * c[1] + .114 * c[2]) / 255, light = lum > .55;
    root.style.setProperty("--bg", e.target.value);
    root.style.setProperty("--ink", light ? "#2a1f2a" : "#f1e6ee");
    root.style.setProperty("--muted", light ? "#6b5b6b" : "#9a8a9a");
  });

  // ---------- Flower type toggle (each type remembers its own flower color) ----------
  var current = "tulip", flowerColor = { tulip: "#ff5d8f", dandelion: "#ffd23f" };
  var bT = document.getElementById("bTulip"), bD = document.getElementById("bDandelion");
  function setType(t) {
    if (t === current) return;
    flowerColor[current] = inputs[0].value; current = t; inputs[0].value = flowerColor[t];
    bT.setAttribute("aria-pressed", t === "tulip"); bD.setAttribute("aria-pressed", t === "dandelion");
    build(t); buildPalette();
  }
  bT.addEventListener("click", function () { setType("tulip"); });
  bD.addEventListener("click", function () { setType("dandelion"); });
  build("tulip");

  // ---------- Canvas ----------
  var canvas = document.getElementById("c"), ctx = canvas.getContext("2d");
  var W, H, cw, ch, cols, rows, fs, S, baseS, dpr;
  var zoom = 1, zoomTarget = 1;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    var r = canvas.getBoundingClientRect(); W = r.width; H = r.height;
    canvas.width = W * dpr; canvas.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fs = W < 500 ? 11 : 13;
    ctx.font = fs + "px ui-monospace, Menlo, Consolas, monospace"; ctx.textBaseline = "top";
    cw = ctx.measureText("M").width; ch = fs * 1.0;
    cols = Math.floor(W / cw); rows = Math.floor(H / ch);
    baseS = Math.min(W / 3.1, H / 3.4); S = baseS * zoom;
  }
  window.addEventListener("resize", resize); resize();

  // ---------- Zoom (each press changes size by 20%) ----------
  document.getElementById("zOut").addEventListener("click", function () { zoomTarget = Math.max(.3, zoomTarget * .8); });
  document.getElementById("zIn").addEventListener("click", function () { zoomTarget = Math.min(1.6, zoomTarget / .8); });

  // ---------- Rotation: auto clockwise (seen from above) + drag + inertia ----------
  var angle = 0, AUTO = -0.45, vel = AUTO, dragging = false, lastX = 0, lastT = 0;
  canvas.addEventListener("pointerdown", function (e) {
    dragging = true; lastX = e.clientX; lastT = performance.now(); vel = 0; canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", function (e) {
    if (!dragging) return;
    var now = performance.now(), dx = e.clientX - lastX, dt = Math.max(1, now - lastT) / 1000;
    angle += dx * 0.012; vel = Math.max(-8, Math.min(8, dx * 0.012 / dt)); lastX = e.clientX; lastT = now;
  });
  function up() { dragging = false; }
  canvas.addEventListener("pointerup", up); canvas.addEventListener("pointercancel", up);

  // ---------- Render ----------
  var zbuf, cbuf, mbuf, lbuf, prev = performance.now();
  function frame(now) {
    var dt = Math.min(.05, (now - prev) / 1000); prev = now;
    zoom += (zoomTarget - zoom) * Math.min(1, dt * 10); S = baseS * zoom;
    if (!dragging) { vel += (AUTO - vel) * Math.min(1, dt * 1.5); angle += vel * dt; }
    var N = cols * rows;
    if (!zbuf || zbuf.length !== N) { zbuf = new Float32Array(N); cbuf = new Array(N); mbuf = new Uint8Array(N); lbuf = new Uint8Array(N); }
    zbuf.fill(-1e9); for (var i = 0; i < N; i++) cbuf[i] = null;
    var cs = Math.cos(angle), sn = Math.sin(angle), ox = W / 2, oy = H * .52;
    for (var i = 0; i < pts.length; i++) {
      var p = pts[i], x = p.x * cs + p.z * sn, z = -p.x * sn + p.z * cs, k = 1 / (1 - z * .1);
      var c = Math.floor((ox + x * S * k) / cw), r = Math.floor((oy - p.y * S * k) / ch);
      if (c < 0 || c >= cols || r < 0 || r >= rows) continue;
      var id = r * cols + c;
      if (z > zbuf[id]) {
        zbuf[id] = z; cbuf[id] = p.ch; mbuf[id] = p.m;
        lbuf[id] = Math.max(0, Math.min(LEVELS - 1, Math.floor((z + 1.5) / 3 * LEVELS)));
      }
    }
    ctx.clearRect(0, 0, W, H);
    var xo = (W - cols * cw) / 2;
    for (var m = 0; m < 4; m++) for (var l = 0; l < LEVELS; l++) {
      ctx.fillStyle = palette[m][l];
      for (var id = 0; id < N; id++) {
        if (cbuf[id] && mbuf[id] === m && lbuf[id] === l) ctx.fillText(cbuf[id], xo + (id % cols) * cw, Math.floor(id / cols) * ch);
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
